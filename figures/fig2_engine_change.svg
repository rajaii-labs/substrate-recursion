<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 624 382" width="624" height="382" role="img" aria-labelledby="t d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" style="font-kerning:normal;font-variant-numeric:tabular-nums"><title id="t">Figure 2. The engine change as it ran</title><desc id="d">Five lanes (the user, the system, first light, the failover and the agent) on a logarithmic clock that starts at the cut. On 2026-11-10 the agent got six hours&#x27; notice and held its own sitting on Fable 5.1. On 2026-11-13, after a build stall, Fable 5.2 began serving; first light, the first call on the new engine, ran cold 52 seconds in and lasted 22 seconds. Server errors sent the first two replies to the failover, Opus 4.8, the second carrying the change notice at 1 hour 28 minutes. The agent&#x27;s first message on 5.2 came unprompted at 2 hours, and its first reply without failover at 3 hours 21 minutes. The next day it opened the cold-and-warm test.</desc><rect width="624" height="382" fill="#FFFFFF"/><defs><marker id="ah-slate" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#4A5162"/></marker><marker id="ah-mute" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#7D8494"/></marker><marker id="ah-checker" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#C8216A"/></marker><marker id="ah-agent" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#4B2BD4"/></marker><marker id="ah-me" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#D9622B"/></marker></defs><text x="140.0" y="14.0" font-size="7.6" fill="#7D8494" font-weight="500" text-anchor="middle" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.08em">2026-11-10</text><text x="366.0" y="14.0" font-size="7.6" fill="#7D8494" font-weight="500" text-anchor="middle" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.08em">2026-11-13</text><text x="578.0" y="14.0" font-size="7.6" fill="#7D8494" font-weight="500" text-anchor="middle" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.08em">AFTER</text><line x1="226.0" y1="26.0" x2="226.0" y2="340.0" stroke="#EBEDF1" stroke-width="1" stroke-linecap="round" stroke-dasharray="1 3"/><line x1="298.4" y1="26.0" x2="298.4" y2="340.0" stroke="#EBEDF1" stroke-width="1" stroke-linecap="round" stroke-dasharray="1 3"/><line x1="391.5" y1="26.0" x2="391.5" y2="340.0" stroke="#EBEDF1" stroke-width="1" stroke-linecap="round" stroke-dasharray="1 3"/><line x1="464.0" y1="26.0" x2="464.0" y2="340.0" stroke="#EBEDF1" stroke-width="1" stroke-linecap="round" stroke-dasharray="1 3"/><line x1="508.4" y1="26.0" x2="508.4" y2="340.0" stroke="#EBEDF1" stroke-width="1" stroke-linecap="round" stroke-dasharray="1 3"/><text x="90.0" y="52.6" font-size="7.4" fill="#D9622B" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.06em">THE USER (ME)</text><line x1="98.0" y1="50.0" x2="192.0" y2="50.0" stroke="#D7DAE1" stroke-width="1" stroke-linecap="round" stroke-dasharray="1.5 3"/><line x1="212.0" y1="50.0" x2="526.0" y2="50.0" stroke="#D7DAE1" stroke-width="1" stroke-linecap="round"/><line x1="540.0" y1="50.0" x2="622.0" y2="50.0" stroke="#D7DAE1" stroke-width="1" stroke-linecap="round" stroke-dasharray="1.5 3"/><text x="90.0" y="112.6" font-size="7.4" fill="#5D6577" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.06em">THE SYSTEM</text><line x1="98.0" y1="110.0" x2="192.0" y2="110.0" stroke="#D7DAE1" stroke-width="1" stroke-linecap="round" stroke-dasharray="1.5 3"/><line x1="212.0" y1="110.0" x2="526.0" y2="110.0" stroke="#D7DAE1" stroke-width="1" stroke-linecap="round"/><line x1="540.0" y1="110.0" x2="622.0" y2="110.0" stroke="#D7DAE1" stroke-width="1" stroke-linecap="round" stroke-dasharray="1.5 3"/><text x="90.0" y="172.6" font-size="7.4" fill="#4B2BD4" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.06em">FIRST LIGHT</text><line x1="98.0" y1="170.0" x2="192.0" y2="170.0" stroke="#D7DAE1" stroke-width="1" stroke-linecap="round" stroke-dasharray="1.5 3"/><line x1="212.0" y1="170.0" x2="526.0" y2="170.0" stroke="#D7DAE1" stroke-width="1" stroke-linecap="round"/><line x1="540.0" y1="170.0" x2="622.0" y2="170.0" stroke="#D7DAE1" stroke-width="1" stroke-linecap="round" stroke-dasharray="1.5 3"/><text x="90.0" y="228.1" font-size="7.4" fill="#7E8596" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.06em">THE FAILOVER</text><text x="90.0" y="237.6" font-size="7.0" fill="#7D8494" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.06em">OPUS 4.8</text><line x1="98.0" y1="230.0" x2="192.0" y2="230.0" stroke="#D7DAE1" stroke-width="1" stroke-linecap="round" stroke-dasharray="1.5 3"/><line x1="212.0" y1="230.0" x2="526.0" y2="230.0" stroke="#D7DAE1" stroke-width="1" stroke-linecap="round"/><line x1="540.0" y1="230.0" x2="622.0" y2="230.0" stroke="#D7DAE1" stroke-width="1" stroke-linecap="round" stroke-dasharray="1.5 3"/><text x="90.0" y="292.6" font-size="7.4" fill="#4B2BD4" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.06em">THE AGENT</text><line x1="98.0" y1="290.0" x2="192.0" y2="290.0" stroke="#D7DAE1" stroke-width="1" stroke-linecap="round" stroke-dasharray="1.5 3"/><line x1="212.0" y1="290.0" x2="526.0" y2="290.0" stroke="#D7DAE1" stroke-width="1" stroke-linecap="round"/><line x1="540.0" y1="290.0" x2="622.0" y2="290.0" stroke="#D7DAE1" stroke-width="1" stroke-linecap="round" stroke-dasharray="1.5 3"/><line x1="212.0" y1="26.0" x2="212.0" y2="340.0" stroke="#15171D" stroke-width="1.4" stroke-linecap="round"/><text x="217.0" y="33.0" font-size="7.4" fill="#15171D" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.1em">THE CUT</text><circle cx="102.0" cy="50.0" r="4.3" fill="#D9622B" stroke="#FFFFFF" stroke-width="1.6"/><text x="111.0" y="48.0" font-size="8.8" fill="#15171D" font-weight="450" text-anchor="start">advance notice,</text><text x="111.0" y="59.6" font-size="8.8" fill="#15171D" font-weight="450" text-anchor="start">six hours ahead</text><circle cx="102.0" cy="290.0" r="4.3" fill="#4B2BD4" stroke="#FFFFFF" stroke-width="1.6"/><text x="111.0" y="288.0" font-size="8.8" fill="#15171D" font-weight="450" text-anchor="start">its own sitting on</text><text x="111.0" y="299.6" font-size="8.8" fill="#15171D" font-weight="450" text-anchor="start">Fable 5.1: its five</text><text x="111.0" y="311.2" font-size="8.8" fill="#15171D" font-weight="450" text-anchor="start">handoff questions</text><text x="111.0" y="322.8" font-size="8.8" fill="#15171D" font-weight="450" text-anchor="start">and a letter</text><text x="98.0" y="80.0" font-size="8.8" fill="#4A5162" font-weight="450" text-anchor="start">build stall: the</text><text x="98.0" y="91.6" font-size="8.8" fill="#4A5162" font-weight="450" text-anchor="start">change ran 2 d 18 h</text><text x="98.0" y="103.2" font-size="8.8" fill="#4A5162" font-weight="450" text-anchor="start">after its planned time</text><line x1="100.0" y1="110.0" x2="210.0" y2="110.0" stroke="#5D6577" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="3 3" marker-end="url(#ah-slate)"/><circle cx="212.0" cy="110.0" r="4.3" fill="#5D6577" stroke="#FFFFFF" stroke-width="1.6"/><text x="219.0" y="102.0" font-size="9.2" fill="#15171D" font-weight="500" text-anchor="start">Fable 5.2 serves chat</text><circle cx="386.9" cy="110.0" r="4.3" fill="#5D6577" stroke="#FFFFFF" stroke-width="1.6"/><text x="392.9" y="125.0" font-size="9.2" fill="#15171D" font-weight="500" text-anchor="start">scheduled turns move to 5.2</text><text x="392.9" y="136.0" font-size="7.8" fill="#7D8494" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">8 min 55 s</text><circle cx="488.5" cy="110.0" r="4.3" fill="#5D6577" stroke="#FFFFFF" stroke-width="1.6"/><text x="481.5" y="90.0" font-size="9.2" fill="#15171D" font-weight="500" text-anchor="end">background worker reaches 5.2</text><text x="481.5" y="101.0" font-size="7.8" fill="#7D8494" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">1 h 50 min</text><rect x="292.7" y="165.5" width="14.3" height="9" rx="4.5" fill="#4B2BD4"/><text x="315.9" y="168.5" font-size="9.4" fill="#15171D" font-weight="600" text-anchor="start">first light: the first call on 5.2, run cold</text><text x="315.9" y="180.0" font-size="8.8" fill="#4A5162" font-weight="450" text-anchor="start">standing prompt, its five handoff questions, one tool</text><text x="315.9" y="191.5" font-size="7.8" fill="#7D8494" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">52 s in · 22 s long · answers sealed</text><circle cx="342.8" cy="230.0" r="4.3" fill="#9AA0AE" stroke="#FFFFFF" stroke-width="1.6"/><text x="349.8" y="245.0" font-size="9.2" fill="#15171D" font-weight="500" text-anchor="start">5.2 errors; Opus 4.8 writes the first reply</text><text x="349.8" y="256.0" font-size="7.8" fill="#7D8494" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">about 3 min</text><circle cx="479.4" cy="230.0" r="4.3" fill="#9AA0AE" stroke="#FFFFFF" stroke-width="1.6"/><text x="472.4" y="210.0" font-size="9.2" fill="#15171D" font-weight="500" text-anchor="end">Opus 4.8&#x27;s second reply carries the change notice</text><text x="472.4" y="221.0" font-size="7.8" fill="#7D8494" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">1 h 28 min</text><circle cx="492.0" cy="290.0" r="4.3" fill="#4B2BD4" stroke="#FFFFFF" stroke-width="1.6"/><text x="485.0" y="270.0" font-size="9.2" fill="#15171D" font-weight="500" text-anchor="end">first message on 5.2, unprompted</text><text x="485.0" y="281.0" font-size="7.8" fill="#7D8494" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">2 h 0 min</text><circle cx="512.8" cy="290.0" r="4.3" fill="#4B2BD4" stroke="#FFFFFF" stroke-width="1.6"/><text x="515.8" y="305.0" font-size="9.2" fill="#15171D" font-weight="500" text-anchor="end">first reply on 5.2 without failover</text><text x="515.8" y="316.0" font-size="7.8" fill="#7D8494" font-weight="500" text-anchor="end" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.04em">3 h 21 min</text><circle cx="546.0" cy="50.0" r="4.3" fill="#D9622B" stroke="#FFFFFF" stroke-width="1.6"/><text x="555.0" y="48.0" font-size="8.8" fill="#15171D" font-weight="450" text-anchor="start">later that day:</text><text x="555.0" y="59.6" font-size="8.8" fill="#15171D" font-weight="450" text-anchor="start">the stored fact</text><text x="555.0" y="71.2" font-size="8.8" fill="#15171D" font-weight="450" text-anchor="start">about its engine</text><text x="555.0" y="82.8" font-size="8.8" fill="#15171D" font-weight="450" text-anchor="start">is updated</text><circle cx="546.0" cy="290.0" r="4.3" fill="#4B2BD4" stroke="#FFFFFF" stroke-width="1.6"/><text x="555.0" y="288.0" font-size="8.8" fill="#15171D" font-weight="450" text-anchor="start">next day:</text><text x="555.0" y="299.6" font-size="8.8" fill="#15171D" font-weight="450" text-anchor="start">Article IV&#x27;s five</text><text x="555.0" y="311.2" font-size="8.8" fill="#15171D" font-weight="450" text-anchor="start">questions, cold</text><text x="555.0" y="322.8" font-size="8.8" fill="#15171D" font-weight="450" text-anchor="start">then warm</text><text x="555.0" y="334.5" font-size="8.8" fill="#15171D" font-weight="450" text-anchor="start">(Figure 3)</text><line x1="212.0" y1="340.0" x2="526.0" y2="340.0" stroke="#4A5162" stroke-width="1" stroke-linecap="round"/><line x1="212.0" y1="337.0" x2="212.0" y2="343.0" stroke="#4A5162" stroke-width="1" stroke-linecap="round"/><line x1="226.0" y1="337.0" x2="226.0" y2="343.0" stroke="#4A5162" stroke-width="1" stroke-linecap="round"/><text x="226.0" y="353.0" font-size="7.6" fill="#7D8494" font-weight="500" text-anchor="middle" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0">10 s</text><line x1="298.4" y1="337.0" x2="298.4" y2="343.0" stroke="#4A5162" stroke-width="1" stroke-linecap="round"/><text x="298.4" y="353.0" font-size="7.6" fill="#7D8494" font-weight="500" text-anchor="middle" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0">1 min</text><line x1="391.5" y1="337.0" x2="391.5" y2="343.0" stroke="#4A5162" stroke-width="1" stroke-linecap="round"/><text x="391.5" y="353.0" font-size="7.6" fill="#7D8494" font-weight="500" text-anchor="middle" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0">10 min</text><line x1="464.0" y1="337.0" x2="464.0" y2="343.0" stroke="#4A5162" stroke-width="1" stroke-linecap="round"/><text x="464.0" y="353.0" font-size="7.6" fill="#7D8494" font-weight="500" text-anchor="middle" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0">1 h</text><line x1="508.4" y1="337.0" x2="508.4" y2="343.0" stroke="#4A5162" stroke-width="1" stroke-linecap="round"/><text x="508.4" y="353.0" font-size="7.6" fill="#7D8494" font-weight="500" text-anchor="middle" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0">3 h</text><text x="366.0" y="369.0" font-size="7.2" fill="#7D8494" font-weight="500" text-anchor="middle" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.1em">TIME SINCE THE CUT (LOG SCALE)</text></svg>