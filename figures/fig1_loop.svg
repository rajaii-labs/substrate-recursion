<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 624 432" width="624" height="432" role="img" aria-labelledby="t d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" style="font-kerning:normal;font-variant-numeric:tabular-nums"><title id="t">Figure 1. Who does what in the improvement loop</title><desc id="d">Twelve stages in a loop, drawn as nine steps. The agent notices a gap, names the capability and writes the specification; I set the priority, review, merge and deploy; a coordinator and a coding session build it; the agent uses it, and a later request builds on it. The checker, the code that grades every reply, sits at the centre: the agent can read it but cannot write to it, and has never opened it. Three changes to it came round the loop from the agent&#x27;s own specifications.</desc><rect width="624" height="432" fill="#FFFFFF"/><defs><marker id="ah-slate" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#4A5162"/></marker><marker id="ah-mute" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#7D8494"/></marker><marker id="ah-checker" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#C8216A"/></marker><marker id="ah-agent" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#4B2BD4"/></marker><marker id="ah-me" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.6,1.2 L9,5 L0.6,8.8 L2.6,5 Z" fill="#D9622B"/></marker></defs><rect x="4.0" y="10.0" width="132.0" height="66.0" rx="7" ry="7" fill="#FFFFFF" stroke="#D7DAE1" stroke-width="1"/><rect x="4.5" y="20.0" width="3" height="46" rx="1.5" fill="#4B2BD4"/><text x="17.0" y="29.0" font-size="7.4" fill="#4B2BD4" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.07em">1–2 · THE AGENT</text><text x="17.0" y="47.0" font-size="10.0" fill="#15171D" font-weight="450" text-anchor="start">notices a gap and</text><text x="17.0" y="60.0" font-size="10.0" fill="#15171D" font-weight="450" text-anchor="start">names the capability</text><rect x="160.0" y="10.0" width="132.0" height="66.0" rx="7" ry="7" fill="#FFFFFF" stroke="#D7DAE1" stroke-width="1"/><rect x="160.5" y="20.0" width="3" height="46" rx="1.5" fill="#D9622B"/><text x="173.0" y="29.0" font-size="7.4" fill="#D9622B" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.07em">3 · ME</text><text x="173.0" y="50.0" font-size="10.0" fill="#15171D" font-weight="450" text-anchor="start">sets the priority</text><rect x="316.0" y="10.0" width="132.0" height="66.0" rx="7" ry="7" fill="#FFFFFF" stroke="#D7DAE1" stroke-width="1"/><rect x="316.5" y="20.0" width="3" height="46" rx="1.5" fill="#4B2BD4"/><text x="329.0" y="29.0" font-size="7.4" fill="#4B2BD4" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.07em">4 · THE AGENT</text><text x="329.0" y="47.0" font-size="10.0" fill="#15171D" font-weight="450" text-anchor="start">writes the</text><text x="329.0" y="60.0" font-size="10.0" fill="#15171D" font-weight="450" text-anchor="start">specification</text><rect x="472.0" y="10.0" width="132.0" height="66.0" rx="7" ry="7" fill="#FFFFFF" stroke="#D7DAE1" stroke-width="1"/><rect x="472.5" y="20.0" width="3" height="46" rx="1.5" fill="#5D6577"/><text x="485.0" y="29.0" font-size="7.4" fill="#5D6577" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.07em">5 · COORDINATOR</text><text x="485.0" y="43.0" font-size="10.0" fill="#15171D" font-weight="450" text-anchor="start">wraps its words,</text><text x="485.0" y="56.0" font-size="10.0" fill="#15171D" font-weight="450" text-anchor="start">almost whole,</text><text x="485.0" y="69.0" font-size="10.0" fill="#15171D" font-weight="450" text-anchor="start">in a build kit</text><rect x="472.0" y="132.0" width="132.0" height="66.0" rx="7" ry="7" fill="#FFFFFF" stroke="#D7DAE1" stroke-width="1"/><rect x="472.5" y="142.0" width="3" height="46" rx="1.5" fill="#5D6577"/><text x="485.0" y="151.0" font-size="7.4" fill="#5D6577" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.07em">6–7 · CODING SESSION</text><text x="485.0" y="169.0" font-size="10.0" fill="#15171D" font-weight="450" text-anchor="start">writes and tests</text><text x="485.0" y="182.0" font-size="10.0" fill="#15171D" font-weight="450" text-anchor="start">the code</text><rect x="472.0" y="256.0" width="132.0" height="66.0" rx="7" ry="7" fill="#FFFFFF" stroke="#D7DAE1" stroke-width="1"/><rect x="472.5" y="266.0" width="3" height="46" rx="1.5" fill="#D9622B"/><text x="485.0" y="275.0" font-size="7.4" fill="#D9622B" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.07em">8 · REVIEW</text><text x="485.0" y="289.0" font-size="10.0" fill="#15171D" font-weight="450" text-anchor="start">I review, with a</text><text x="485.0" y="302.0" font-size="10.0" fill="#15171D" font-weight="450" text-anchor="start">review agent on</text><text x="485.0" y="315.0" font-size="10.0" fill="#15171D" font-weight="450" text-anchor="start">22 of the 35</text><rect x="246.0" y="256.0" width="132.0" height="66.0" rx="7" ry="7" fill="#FFFFFF" stroke="#D7DAE1" stroke-width="1"/><rect x="246.5" y="266.0" width="3" height="46" rx="1.5